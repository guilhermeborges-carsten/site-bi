{% extends 'base.html' %}
{% block title %}Editar Usuário{% endblock %}
{% block content %}
  <div class="login-container" style="max-width:500px;">
    <h2 style="text-align:center; color:#0056a6; margin-bottom:24px;">Editar Usuário</h2>
    <form method="POST">
      <label for="nome" style="font-weight:bold; color:#0056a6;">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ usuario.nome }}" required>
      <label for="email" style="font-weight:bold; color:#0056a6;">Email</label>
      <input type="email" id="email" name="email" value="{{ usuario.email }}" required>
      <label for="senha" style="font-weight:bold; color:#0056a6;">Nova Senha (deixe em branco para não alterar)</label>
      <input type="password" id="senha" name="senha" placeholder="Nova senha">
      <label for="tipo" style="font-weight:bold; color:#0056a6;">Tipo de Usuário</label>
      <select id="tipo" name="tipo">
        <option value="usuario" {% if usuario.tipo == 'usuario' %}selected{% endif %}>Usuário</option>
        <option value="admin" {% if usuario.tipo == 'admin' %}selected{% endif %}>Admin</option>
      </select>
      <button type="submit" style="margin-top:16px;">Salvar Alterações</button>
    </form>
    <div style="text-align:center; margin-top:20px;">
      <a href="{{ url_for('usuarios') }}" style="color:#0056a6; font-weight:bold;">&larr; Voltar para Controle de Usuários</a>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
  </div>
{% endblock %}
